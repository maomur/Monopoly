<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1572CF"/>
      <stop offset="1" stop-color="#073B73"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#021C38" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- Fondo a sangre (apto para iconos "maskable") -->
  <rect width="512" height="512" fill="url(#sea)"/>

  <!-- Mini tablero -->
  <g filter="url(#sh)">
    <rect x="116" y="116" width="280" height="280" rx="34" fill="#FFFFFF"/>
  </g>
  <!-- Bandas de color de los grupos, como en el tablero del juego -->
  <g>
    <rect x="164" y="130" width="38" height="16" rx="4" fill="#D7263D"/>
    <rect x="210" y="130" width="38" height="16" rx="4" fill="#D7263D"/>
    <rect x="264" y="130" width="38" height="16" rx="4" fill="#FFD23F"/>
    <rect x="310" y="130" width="38" height="16" rx="4" fill="#FFD23F"/>

    <rect x="366" y="164" width="16" height="38" rx="4" fill="#1E9E5A"/>
    <rect x="366" y="210" width="16" height="38" rx="4" fill="#1E9E5A"/>
    <rect x="366" y="264" width="16" height="38" rx="4" fill="#1B3A8C"/>
    <rect x="366" y="310" width="16" height="38" rx="4" fill="#1B3A8C"/>

    <rect x="310" y="366" width="38" height="16" rx="4" fill="#8B4A2B"/>
    <rect x="264" y="366" width="38" height="16" rx="4" fill="#8B4A2B"/>
    <rect x="210" y="366" width="38" height="16" rx="4" fill="#5EC8E5"/>
    <rect x="164" y="366" width="38" height="16" rx="4" fill="#5EC8E5"/>

    <rect x="130" y="310" width="16" height="38" rx="4" fill="#E0458B"/>
    <rect x="130" y="264" width="16" height="38" rx="4" fill="#E0458B"/>
    <rect x="130" y="210" width="16" height="38" rx="4" fill="#F28C28"/>
    <rect x="130" y="164" width="16" height="38" rx="4" fill="#F28C28"/>
  </g>

  <!-- Centro: las torres de la Sagrada Família, como la ficha del juego -->
  <g fill="#B0442D">
    <path d="M214 330 L226 206 L238 330 Z"/>
    <path d="M241 330 L256 176 L271 330 Z"/>
    <path d="M274 330 L286 206 L298 330 Z"/>
    <rect x="200" y="322" width="112" height="16" rx="6"/>
  </g>
  <!-- Detalle: ventanitas en las torres -->
  <g fill="#FFFFFF" opacity=".85">
    <rect x="252" y="262" width="8" height="14" rx="4"/>
    <rect x="222" y="284" width="7" height="12" rx="3.5"/>
    <rect x="283" y="284" width="7" height="12" rx="3.5"/>
  </g>
</svg>
